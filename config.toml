# ─────────────────────────────────────────────────────────────────────────────
# Argus — Central Configuration
# Every tuneable threshold and weight lives here. No magic numbers in code.
# ─────────────────────────────────────────────────────────────────────────────

[general]
# Thumbnail edge length (px) used for Stage 1-3 processing.
thumbnail_size = 256
# How many images to process per batch (resumable).
batch_size = 500
# SQLite database path (relative to repo root).
db_path = "argus.db"
# Directory where thumbnail cache is stored.
thumbnail_cache_dir = "thumbnails/"

# ── Stage 0: Exact duplicate detection ───────────────────────────────────────
[stage0]
# MD5 is used for exact-match grouping only (not security).
hash_algorithm = "md5"

# ── Stage 1: Perceptual hashing ──────────────────────────────────────────────
[stage1]
# Hash algorithm: "phash" | "dhash" | "ahash" | "whash"
hash_algorithm = "phash"
# Hash size (bits = hash_size²). 8 → 64-bit hash.
hash_size = 8
# Maximum Hamming distance to consider two images near-duplicate candidates.
# Range 0–64 for a 64-bit hash. Lower = stricter.
hamming_threshold = 8

# ── Stage 2: CLIP embedding + FAISS ──────────────────────────────────────────
[stage2]
# CLIP model variant. "ViT-B-32" is fast and lightweight.
clip_model = "ViT-B-32"
# Pretrained weights: "laion2b_s34b_b79k" (permissively licensed under MIT).
clip_pretrained = "laion2b_s34b_b79k"
# Embedding batch size (default 32). Memory is freed between batches.
batch_size = 32
# Also store embeddings for 90/180/270 degree rotated thumbnails (default: true).
enable_rotation_embeddings = true
# Cosine-similarity threshold to accept a candidate pair.
cosine_threshold = 0.90
# Number of neighbours to retrieve per query.
faiss_k = 20

# ── Stage 3: Geometric verification (keypoint matching + RANSAC) ─────────────
[stage3]
# Feature detector algorithm: "sift" (patent expired, Apache 2.0) or "orb".
algorithm = "sift"
# Maximum number of keypoint features to extract per image proxy.
max_features = 2000
# Minimum keypoints required on each image. Below this, verdict is 'inconclusive'.
min_keypoints = 100
# Target proxy edge length (px) for geometric verification (default 512).
proxy_size = 512
# Lowe's distance ratio threshold for matching (lower = stricter).
ratio_threshold = 0.75
# RANSAC reprojection error threshold in pixels.
ransac_reproj_threshold = 4.0
# Minimum number of geometrically consistent inliers to accept a pair.
min_inliers = 20
# Minimum ratio of inliers to good feature matches.
min_inlier_ratio = 0.65
# Geometric transformation model: "affine" (similarity: scale+rot+trans) or "homography"
transformation_model = "affine"

# ── Stage 4: Quality scoring & proxy alignment ──────────────────────────────
[quality]
# Target proxy edge length (px) for quality and SSIM evaluation (default 1024).
proxy_size = 1024
# Feature detector algorithm: "sift" or "orb".
algorithm = "sift"
# Maximum number of keypoint features to extract per image proxy.
max_features = 2000
# Lowe's distance ratio threshold for matching.
ratio_threshold = 0.75
# RANSAC reprojection error threshold in pixels.
ransac_reproj_threshold = 4.0
# Minimum number of geometrically consistent inliers to accept alignment.
min_align_inliers = 15
# Minimum ratio of inliers to good feature matches.
min_align_inlier_ratio = 0.50

# ── Stage 4: Keeper selection ─────────────────────────────────────────────────
[keeper]
default_mode = "balanced"

[keeper.modes.conservative]
ssim_gray = 0.98
ssim_color = 0.97
pixel_ratio_floor = 0.90
min_saving_ratio = 0.0
allow_blur_flag = false

[keeper.modes.balanced]
ssim_gray = 0.98
ssim_color = 0.97
pixel_ratio_floor = 0.60
min_saving_ratio = 0.10
allow_blur_flag = false

[keeper.modes.aggressive]
ssim_gray = 0.95
ssim_color = 0.94
pixel_ratio_floor = 0.25
min_saving_ratio = 0.30
allow_blur_flag = true

# ── Confidence score model ───────────────────────────────────────────────────
[confidence]
model_path = "models/duplicate_confidence.json"

# ── RAW file handling ─────────────────────────────────────────────────────────
[raw]
# Extensions treated as RAW formats (paired with JPEG, never deduped).
extensions = ["arw", "cr2", "cr3", "nef", "orf", "rw2", "dng", "raf", "pef"]

# ── Benchmark dataset generation (bench/make_dataset.py) ─────────────────────
[benchmark]
# Source folder of original images.
originals_dir = "data/originals"
# Output folder for the generated benchmark dataset.
output_dir = "data/benchmark"
# Ground truth CSV filename (written inside output_dir).
ground_truth_filename = "ground_truth.csv"

# Resize: edge lengths (px) to generate. Sizes larger than the original are skipped.
resize_sizes = [128, 256, 512, 1024]

# JPEG re-compression quality levels.
jpeg_qualities = [95, 85, 75, 60]

# Format conversions (Pillow save format strings).
format_targets = ["PNG", "WEBP"]

# Slight crop: fraction of image edge to remove from EACH side.
crop_fractions = [0.02, 0.05]

# Brightness adjustment factors (< 1 = darker, > 1 = brighter).
brightness_factors = [0.85, 1.15]

# Contrast adjustment factors.
contrast_factors = [0.85, 1.15]

# Rotation angles (degrees, counter-clockwise).
rotate_angles = [90, 180, 270]
