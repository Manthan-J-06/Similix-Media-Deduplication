<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Argus — Sign In</title>

  <link rel="apple-touch-icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAAwElEQVR4nGNgGAWjYBSMdMBIimLdK/v/E6Puso4j0eYyUstSch3DSIrFyIahy+OTw+cQRkKWo2uEyd1zr0bRo7SzFa96XI5gxGU5NsUgOXSL0QHIIbj0YjOXiVjLKQUwM9Gjh4lYy9F9DwtyEPjy5CicDVKDK+FicwQTuT5CdgyPjDW5xjCQ7QBqASZyNSIHO3J0kAoYkTmkpgNScgEu85mISanUALg8x4hP8YAURIOiKB4UlRG9quNRMApGwSgAAGs1jtJamNHRAAAAAElFTkSuQmCC">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.15);
      --success: #22c55e;
      --success-bg: rgba(34, 197, 94, 0.15);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc;
        --card-bg: #ffffff;
        --text: #0f172a;
        --text-muted: #64748b;
        --border: #e2e8f0;
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --danger: #dc2626;
        --danger-bg: #fee2e2;
        --success: #16a34a;
        --success-bg: #dcfce7;
      }
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .auth-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%;
      max-width: 420px;
      padding: 2.5rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
    }
    .brand {
      text-align: center;
      margin-bottom: 2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      user-select: none;
    }
    .argus-eye {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      display: inline-block;
      vertical-align: middle;
    }
    .argus-wordmark {
      font-weight: 700;
      letter-spacing: .12em;
      font-size: 1.5rem;
      color: var(--text);
      line-height: 1;
    }
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.5rem;
    }
    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      padding: 0.75rem;
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.15s ease;
    }
    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 0.4rem;
      color: var(--text);
    }
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 0.75rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s ease;
    }
    input[type="email"]:focus,
    input[type="password"]:focus {
      border-color: var(--primary);
    }
    .btn {
      width: 100%;
      padding: 0.8rem;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
      margin-top: 0.5rem;
    }
    .btn:hover {
      background: var(--primary-hover);
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .alert {
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
      display: none;
    }
    .alert-danger {
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid var(--danger);
    }
    .alert-success {
      background: var(--success-bg);
      color: var(--success);
      border: 1px solid var(--success);
    }
    .help-text {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.3rem;
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="brand">
      <svg class="argus-eye" viewBox="0 0 40 40" width="32" height="32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Argus eye mark">
        <path d="M 4 20 C 11 9 29 9 36 20 C 29 31 11 31 4 20 Z" stroke="#2DD4BF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="20" cy="20" r="7" stroke="#2DD4BF" stroke-width="2"/>
        <circle cx="20" cy="20" r="3" fill="#2DD4BF"/>
      </svg>
      <span class="argus-wordmark">ARGUS</span>
    </div>

    <div class="tabs">
      <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Sign In</button>
      <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Register</button>
    </div>

    <div id="alert-box" class="alert"></div>

    <form id="auth-form" onsubmit="handleAuth(event)">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" required autocomplete="email" placeholder="you@example.com">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required minlength="10" placeholder="Minimum 10 characters">
        <div class="help-text" id="password-help">Minimum 10 characters</div>
      </div>

      <button type="submit" class="btn" id="submit-btn">Sign In</button>
    </form>
  </div>

  <script>
    let currentMode = "login";
    let csrfToken = "";
    let cachedCsrfToken = "";

    async function loadCsrf() {
      try {
        const res = await fetch("/auth/csrf");
        if (res.ok) {
          const data = await res.json();
          if (data.csrf_token) {
            csrfToken = data.csrf_token;
            cachedCsrfToken = data.csrf_token;
          }
        }
      } catch (err) {
        console.error("Could not prefetch CSRF token:", err);
      }
    }

    async function getCsrfToken() {
      if (cachedCsrfToken) return cachedCsrfToken;
      if (csrfToken) {
        cachedCsrfToken = csrfToken;
        return cachedCsrfToken;
      }
      await loadCsrf();
      if (csrfToken) {
        cachedCsrfToken = csrfToken;
        return cachedCsrfToken;
      }
      const match = document.cookie.match(new RegExp('(^|;\\s*)argus_csrf=([^;]*)'));
      return match ? decodeURIComponent(match[2]) : "";
    }
    window.getCsrfToken = getCsrfToken;

    function switchTab(mode) {
      currentMode = mode;
      hideAlert();
      document.getElementById("tab-login").classList.toggle("active", mode === "login");
      document.getElementById("tab-register").classList.toggle("active", mode === "register");
      document.getElementById("submit-btn").textContent = mode === "login" ? "Sign In" : "Create Account";
    }

    function showAlert(msg, isSuccess = false) {
      const box = document.getElementById("alert-box");
      box.textContent = msg;
      box.className = "alert " + (isSuccess ? "alert-success" : "alert-danger");
      box.style.display = "block";
    }

    function hideAlert() {
      const box = document.getElementById("alert-box");
      box.style.display = "none";
    }

    async function handleAuth(e) {
      e.preventDefault();
      hideAlert();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const btn = document.getElementById("submit-btn");

      if (password.length < 10) {
        showAlert("Password must be at least 10 characters long");
        return;
      }

      btn.disabled = true;
      const endpoint = currentMode === "login" ? "/auth/login" : "/auth/register";

      try {
        const csrf = await getCsrfToken();
        const headers = { "Content-Type": "application/json" };
        if (csrf) {
          headers["X-CSRF-Token"] = csrf;
        }

        const res = await fetch(endpoint, {
          method: "POST",
          headers: headers,
          body: JSON.stringify({ email, password }),
        });

        const data = await res.json();

        if (!res.ok) {
          showAlert(data.detail || data.message || "Authentication failed");
          btn.disabled = false;
          return;
        }

        if (currentMode === "register") {
          showAlert("Registration successful! Signing you in...", true);
          // Automatically log in
          switchTab("login");
          setTimeout(() => {
            document.getElementById("password").value = password;
            handleAuth(new Event("submit"));
          }, 600);
        } else {
          // Logged in!
          showAlert("Success! Redirecting...", true);
          setTimeout(() => {
            window.location.href = "/";
          }, 400);
        }
      } catch (err) {
        showAlert("Network or server connection error: " + err.message);
      } finally {
        btn.disabled = false;
      }
    }

    function checkUrlNotice() {
      const params = new URLSearchParams(window.location.search);
      const notice = params.get("notice") || params.get("message");
      if (notice) {
        showAlert(notice, true);
      }
    }

    loadCsrf();
    checkUrlNotice();
  </script>
</body>
</html>
