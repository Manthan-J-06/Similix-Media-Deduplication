name: Argus CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          if [ "${{ runner.os }}" = "Linux" ]; then
            pip install --no-cache-dir --extra-index-url https://download.pytorch.org/whl/cpu torch==2.14.1 torchvision==0.29.1
          else
            pip install --no-cache-dir torch==2.14.1 torchvision==0.29.1
          fi
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir -e .

      - name: Run Ruff static analysis (including F821 undefined names)
        run: |
          ruff check .

      - name: Run test suite with pytest
        run: |
          pytest -v
