services:
  argus:
    build:
      context: .
      dockerfile: Dockerfile
    image: argus:latest
    container_name: argus-app
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g
    ports:
      - "8000:8000"
    environment:
      # Secrets and runtime flags passed from environment (never baked into image)
      - SECRET_KEY=${SECRET_KEY}
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-true}
      - HOSTED_MODE=${HOSTED_MODE:-false}
      - BASE_URL=${BASE_URL:-http://localhost:8000}
      - ARGUS_DATA_DIR=/data
      - ARGUS_TRASH_DIR=/data/trash
      - ARGUS_LIBRARY_DIR=/data/library
      - ARGUS_USERS_DIR=/data/users
      - ARGUS_ACCOUNTS_DB=/data/auth.db
      - TMPDIR=/tmp
    volumes:
      # Persistent storage volume for per-user directories, DBs, and library files
      - argus_data:/data
      # To enable Google Drive integration, copy client_secret.json into the data volume:
      #   docker cp /path/to/client_secret.json argus-app:/data/client_secret.json
      # Or add a read-only bind mount (only if the file exists on the host):
      # - /path/to/client_secret.json:/data/client_secret.json:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  argus_data:
    driver: local
